# The live run `scripts/pr-ios-run live` commits as .github/workflows/foto-__ISSUE__-live.yml on its own branch
# __BRANCH__, on top of the head it tests: never copy it by hand. The launcher fills every __NAME__.
# LOOKUP is the gist the tunnel writes its address to; TOKEN is the disposable companion's device token.
name: Foto __ISSUE__ live

on:
  push:
    branches: ['__BRANCH__']

permissions:
  contents: read

jobs:
  live:
    runs-on: [squadd-multi-ios-senza-pr]
    timeout-minutes: 25
    env:
      HEAD_SHA: ${{ github.sha }}
      DERIVED_DATA: ${{ github.workspace }}/../../DerivedData
      SIMULATOR_NAME: Squadd multi CI
      TEST_RUNNER_BRAND_PHOTOS_DIR: ${{ github.workspace }}/ci-foto
      TEST_RUNNER_SQUADD_LIVE_LOOKUP: ${{ secrets.__LOOKUP__ }}
      TEST_RUNNER_SQUADD_LIVE_TOKEN: ${{ secrets.__TOKEN__ }}
      RUNNER_TRACKING_ID: ""
    steps:
      - name: Build and run the live test
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::${TEST_RUNNER_SQUADD_LIVE_TOKEN}"
          dev="+refs/heads/dev:refs/remotes/origin/dev"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git show "${HEAD_SHA}:ci/pr_state.py" > "${RUNNER_TEMP}/pr_state.py"
          git show "${HEAD_SHA}:ci/pr_group.py" > "${RUNNER_TEMP}/pr_group.py"
          python3 "${RUNNER_TEMP}/pr_state.py" "${BRANCH}" "${HEAD_SHA}"
          cd "${GITHUB_WORKSPACE}"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git checkout -qf --detach "${HEAD_SHA}"
          git clean -ffdq
          own="${SIMULATOR_NAME}"; [[ ${RUNNER_NAME} == *-2 ]] && own="${SIMULATOR_NAME} 3"
          udid=$(xcrun simctl list devices available --json | NAME="${own}" python3 -c '
          import json, os, sys
          print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == os.environ["NAME"]))')
          xcrun simctl bootstatus "${udid}" -b > /dev/null
          mkdir -p "${TEST_RUNNER_BRAND_PHOTOS_DIR}"
          nice -n 10 xcodebuild build-for-testing -project HermesMobile.xcodeproj -scheme HermesMobile \
            -destination "platform=iOS Simulator,id=${udid}" -derivedDataPath "${DERIVED_DATA}" \
            -disableAutomaticPackageResolution -enableCodeCoverage NO COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO -quiet
          status=0
          # No parallel clones, as in PR iOS: with them a failure reads «Test case '…' failed on 'Clone 1 of …'», which
          # the grep drops, and the run goes red with no failing line (#97). The whole output stays in the artifact.
          nice -n 10 xcodebuild test-without-building -project HermesMobile.xcodeproj -scheme HermesMobile \
            -destination "platform=iOS Simulator,id=${udid}" -derivedDataPath "${DERIVED_DATA}" \
            -disableAutomaticPackageResolution -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:HermesMobileTests/__TEST__ \
            | tee "${TEST_RUNNER_BRAND_PHOTOS_DIR}/xcodebuild-test.log" \
            | grep -E "^Test (Case|Suite)|: error: -\[|\*\* TEST" || status=1
          cat "${TEST_RUNNER_BRAND_PHOTOS_DIR}"/*.txt || true
          exit "${status}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-run
          path: ci-foto
