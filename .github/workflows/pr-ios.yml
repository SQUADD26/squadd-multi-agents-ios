# PR checks in under a minute, on Roberto's Mac (runner label `squadd-multi-ios`): build every target, run the
# tests of the files the branch touches against dev (ci/pr_tests.py), keep their photos as the `foto` artifact,
# check the String Catalog. Fast because the Mac keeps state between runs: each branch's checkout and DerivedData
# (incremental build) and two booted simulators. Coverage and the index store are off. The full suite and Release
# builds run at night (pr-ci.yml).
#
# It runs on every push to a branch of this repo, so a PR to dev shows the result of its head commit, often before
# it is opened; a push event also starts ~5 s sooner than a pull_request one. The repo is public and the runner is
# a real Mac: only people with write access push here, so fork PRs never reach it (they also need a maintainer's
# approval in the repo settings). No secrets.
name: PR iOS

on:
  push:
    branches-ignore: [dev, main, master]

permissions:
  contents: read

concurrency:
  group: pr-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    name: Build, touched tests, photos, catalog
    if: ${{ !github.event.deleted }}
    runs-on: [self-hosted, squadd-multi-ios]
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.sha }}
      DERIVED_DATA: ${{ github.workspace }}/../../DerivedData
      TEST_TIMES: ${{ github.workspace }}/../../test-times.json
      SIMULATOR_NAME: Squadd multi CI
      TEST_RUNNER_HERMEX_CI: "1"
      TEST_RUNNER_FOTO_DIR: ${{ github.workspace }}/ci-foto
      TEST_RUNNER_BRAND_PHOTOS_DIR: ${{ github.workspace }}/ci-foto
      # Untracked: the runner neither waits for nor kills the build daemons (ibtoold) at the end; they stay warm.
      RUNNER_TRACKING_ID: ""
    steps:
      # This branch's own checkout and DerivedData (ci/pr_state.py), then a fetch of the head and dev: unchanged
      # files keep their dates, so the build recompiles only what changed since this branch's last run. Then the
      # two simulators, booted once and kept on between runs. Public repo: no credentials written.
      - name: Code and simulators
        id: sim
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dev="+refs/heads/dev:refs/remotes/origin/dev"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git show "${HEAD_SHA}:ci/pr_state.py" > "${RUNNER_TEMP}/pr_state.py"
          python3 "${RUNNER_TEMP}/pr_state.py" "${BRANCH}" "${HEAD_SHA}"
          cd "${GITHUB_WORKSPACE}"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git checkout -qf --detach "${HEAD_SHA}"
          git clean -ffdq
          git diff --name-only "$(git merge-base origin/dev HEAD)" HEAD > "${RUNNER_TEMP}/changed.txt"
          python3 ci/pr_tests.py < "${RUNNER_TEMP}/changed.txt" > "${RUNNER_TEMP}/tests.txt"
          echo "Tests of the touched files:"; cat "${RUNNER_TEMP}/tests.txt"
          for name in "${SIMULATOR_NAME}" "${SIMULATOR_NAME} 2"; do
            udid=$(xcrun simctl list devices available --json | NAME="${name}" python3 -c '
          import json, os, sys
          print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == os.environ["NAME"]))')
            xcrun simctl bootstatus "${udid}" -b > /dev/null
            echo "${udid}"
          done | { read -r one; read -r two; echo "udid=${one}"; echo "udid2=${two}"; } >> "$GITHUB_OUTPUT"

      # nice: the build gives way to Roberto's own work when both want the CPU, at full speed otherwise.
      - name: Build
        run: |
          set -euo pipefail
          nice -n 10 xcodebuild build-for-testing -project HermesMobile.xcodeproj -scheme HermesMobile \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "${DERIVED_DATA}" -disableAutomaticPackageResolution -enableCodeCoverage NO \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO -quiet

      # Classes split by the seconds they took last time (photo classes take seconds): both simulators end together.
      - name: Tests of the touched files
        env:
          ONE: ${{ steps.sim.outputs.udid }}
          TWO: ${{ steps.sim.outputs.udid2 }}
        run: |
          set -euo pipefail
          mkdir -p "${TEST_RUNNER_FOTO_DIR}"
          [[ -s "${RUNNER_TEMP}/tests.txt" ]] || { echo "No test touched."; exit 0; }
          (cd "${RUNNER_TEMP}" && python3 "${GITHUB_WORKSPACE}/ci/pr_split.py" split "${TEST_TIMES}" < tests.txt)
          run() {
            xcodebuild test-without-building -project HermesMobile.xcodeproj -scheme HermesMobile \
              -destination "platform=iOS Simulator,id=$1" -derivedDataPath "${DERIVED_DATA}" \
              -disableAutomaticPackageResolution -parallel-testing-enabled NO -collect-test-diagnostics never \
              -resultBundlePath "${RUNNER_TEMP}/$2.xcresult" $(cat "${RUNNER_TEMP}/$2.txt") \
              | grep -E "^Test (Case|Suite)|: error: -\[|\*\* TEST" | tee "${RUNNER_TEMP}/$2.log"
          }
          pids=()
          for half in one two; do
            [[ -s "${RUNNER_TEMP}/${half}.txt" ]] || continue
            udid=${ONE}; [[ ${half} == two ]] && udid=${TWO}
            run "${udid}" "${half}" & pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "${pid}" || failed=1; done
          python3 ci/pr_split.py record "${TEST_TIMES}" "${RUNNER_TEMP}"/*.log
          exit "${failed}"

      # Icon, launch screen and first screen: no test reaches them, so the installed app is photographed.
      - name: Home screen, launch and welcome photos
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          grep -qiE 'AppIcon|LaunchScreen|Info\.plist|Onboarding/' "${RUNNER_TEMP}/changed.txt" || exit 0
          app="${DERIVED_DATA}/Build/Products/Debug-iphonesimulator/HermesMobile.app"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Info.plist")
          xcrun simctl install "${UDID}" "${app}"
          xcrun simctl io "${UDID}" screenshot "${TEST_RUNNER_FOTO_DIR}/1-home-screen.png"
          # Held before main, the app stays on its launch screen for the photo.
          xcrun simctl launch --terminate-running-process --wait-for-debugger "${UDID}" "${id}"
          sleep 2
          xcrun simctl io "${UDID}" screenshot "${TEST_RUNNER_FOTO_DIR}/2-launch.png"
          xcrun simctl launch --terminate-running-process "${UDID}" "${id}"
          sleep 4
          xcrun simctl io "${UDID}" screenshot "${TEST_RUNNER_FOTO_DIR}/3-welcome.png"
          xcrun simctl terminate "${UDID}" "${id}"

      - name: String Catalog
        if: ${{ !cancelled() }}
        run: python3 ci/check_string_catalog.py --derived-data "${DERIVED_DATA}"

      - name: Photos
        if: ${{ !cancelled() && hashFiles('ci-foto/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: foto
          path: ci-foto
