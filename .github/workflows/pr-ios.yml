# PR checks in under a minute, on Roberto's Mac (two runners, label `squadd-multi-ios-shared`): build every
# target, run the tests of the files the branch touches against dev (ci/pr_tests.py), keep their photos as the
# `foto` artifact, check the String Catalog. Fast because the Mac keeps state between runs: each runner keeps
# each branch's checkout and DerivedData (incremental build), and three simulators stay booted, one per runner and
# one shared, so two pushes at once don't queue. Coverage and the index store are off. The full suite and Release
# builds run at night (pr-ci.yml).
#
# It runs on every push to a branch of this repo, so a PR to dev shows the result of its head commit, often before
# it is opened; a push event also starts ~5 s sooner than a pull_request one. The repo is public and the runner is
# a real Mac: only people with write access push here, so fork PRs never reach it (they also need a maintainer's
# approval in the repo settings). Pushes to dev, main and master are left to the nightly run. No secrets.
name: PR iOS

on:
  push:
    branches-ignore: [dev, main, master]

permissions:
  contents: read

concurrency:
  group: pr-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    name: Build, touched tests, photos, catalog
    if: ${{ !github.event.deleted }}
    runs-on: [squadd-multi-ios-shared]
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.sha }}
      DERIVED_DATA: ${{ github.workspace }}/../../DerivedData
      TEST_TIMES: ${{ github.workspace }}/../../test-times.json
      SIMULATOR_NAME: Squadd multi CI
      TEST_RUNNER_HERMEX_CI: "1"
      TEST_RUNNER_FOTO_DIR: ${{ github.workspace }}/ci-foto
      TEST_RUNNER_BRAND_PHOTOS_DIR: ${{ github.workspace }}/ci-foto
      # Untracked: the runner neither waits for nor kills the build daemons (ibtoold) at the end; they stay warm.
      RUNNER_TRACKING_ID: ""
    # Three steps, not one per part: each step costs ~0.35 s to start and ~0.5 s to upload its log at the end.
    # The parts stay apart as groups in the log.
    steps:
      # This branch's own checkout and DerivedData (ci/pr_state.py), then a fetch of the head and dev: unchanged
      # files keep their dates, so the build recompiles only what changed since this branch's last run. Then the
      # two simulators, booted once and kept on between runs, and the build. Public repo: no credentials written.
      # nice (here and for the tests): gives way to Roberto's own work when both want the CPU, full speed otherwise.
      - name: Code, simulators and build
        id: sim
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::group::Code and simulators"
          dev="+refs/heads/dev:refs/remotes/origin/dev"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git show "${HEAD_SHA}:ci/pr_state.py" > "${RUNNER_TEMP}/pr_state.py"
          git show "${HEAD_SHA}:ci/pr_group.py" > "${RUNNER_TEMP}/pr_group.py"
          python3 "${RUNNER_TEMP}/pr_state.py" "${BRANCH}" "${HEAD_SHA}"
          cd "${GITHUB_WORKSPACE}"
          git fetch -q --no-tags origin "${HEAD_SHA}" "${dev}"
          git checkout -qf --detach "${HEAD_SHA}"
          git clean -ffdq
          git diff --name-only "$(git merge-base origin/dev HEAD)" HEAD > "${RUNNER_TEMP}/changed.txt"
          python3 ci/pr_tests.py < "${RUNNER_TEMP}/changed.txt" > "${RUNNER_TEMP}/tests.txt"
          echo "Tests of the touched files:"; cat "${RUNNER_TEMP}/tests.txt"
          # This runner's own simulator, then the one both runners share (ci/pr_sims.py).
          own="${SIMULATOR_NAME}"; [[ ${RUNNER_NAME} == *-2 ]] && own="${SIMULATOR_NAME} 3"
          for name in "${own}" "${SIMULATOR_NAME} 2"; do
            udid=$(xcrun simctl list devices available --json | NAME="${name}" python3 -c '
          import json, os, sys
          print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == os.environ["NAME"]))')
            xcrun simctl bootstatus "${udid}" -b > /dev/null
            echo "${udid}"
          done | { read -r one; read -r two; echo "udid=${one}"; echo "udid2=${two}"; } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          one=$(sed -n 's/^udid=//p' "$GITHUB_OUTPUT")
          python3 ci/pr_group.py build nice -n 10 xcodebuild build-for-testing -project HermesMobile.xcodeproj -scheme HermesMobile \
            -destination "platform=iOS Simulator,id=${one}" \
            -derivedDataPath "${DERIVED_DATA}" -disableAutomaticPackageResolution -enableCodeCoverage NO \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO -quiet

      # Tests: classes split by the seconds they took last time (photo classes take seconds), so both simulators
      # end together. Then the photos no test reaches, and the String Catalog, which runs even when a test fails.
      # Each of the Mac's two runners owns a simulator and borrows the shared one while the other runner is idle
      # (ci/pr_sims.py); otherwise TWO is empty and every class runs on its own simulator.
      - name: Touched tests, photos and catalog
        shell: python3 ci/pr_sims.py bash --noprofile --norc -eo pipefail {0}
        env:
          ONE: ${{ steps.sim.outputs.udid }}
          TWO: ${{ steps.sim.outputs.udid2 }}
        run: |
          set -euo pipefail
          echo "::group::Tests of the touched files"
          mkdir -p "${TEST_RUNNER_FOTO_DIR}"
          # A cancelled run can leave these behind: xcodebuild refuses an existing result bundle, and an old log
          # would be recorded as this run's times.
          rm -rf "${RUNNER_TEMP:?}"/{one,two}.{xcresult,log}
          run() {
            nice -n 10 xcodebuild test-without-building -project HermesMobile.xcodeproj -scheme HermesMobile \
              -destination "platform=iOS Simulator,id=$1" -derivedDataPath "${DERIVED_DATA}" \
              -disableAutomaticPackageResolution -parallel-testing-enabled NO -collect-test-diagnostics never \
              -resultBundlePath "${RUNNER_TEMP}/$2.xcresult" $(cat "${RUNNER_TEMP}/$2.txt") \
              | grep -E "^Test (Case|Suite)|: error: -\[|\*\* TEST" | tee "${RUNNER_TEMP}/$2.log"
          }
          failed=0
          if [[ -s "${RUNNER_TEMP}/tests.txt" ]]; then
            (cd "${RUNNER_TEMP}" && python3 "${GITHUB_WORKSPACE}/ci/pr_split.py" split "${TEST_TIMES}" < tests.txt)
            if [[ -z "${TWO}" ]]; then
              cat "${RUNNER_TEMP}/two.txt" >> "${RUNNER_TEMP}/one.txt"; : > "${RUNNER_TEMP}/two.txt"
            fi
            pids=()
            for half in one two; do
              [[ -s "${RUNNER_TEMP}/${half}.txt" ]] || continue
              udid=${ONE}; [[ ${half} == two ]] && udid=${TWO}
              run "${udid}" "${half}" & pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "${pid}" || failed=1; done
            python3 ci/pr_split.py record "${TEST_TIMES}" "${RUNNER_TEMP}"/*.log
          else
            echo "No test touched."
          fi
          echo "::endgroup::"

          echo "::group::String Catalog"
          python3 ci/check_string_catalog.py --derived-data "${DERIVED_DATA}" || failed=1
          echo "::endgroup::"

          # Icon, launch screen and first screen: no test reaches them, so the installed app is photographed.
          if grep -qiE 'AppIcon|LaunchScreen|Info\.plist|Onboarding/' "${RUNNER_TEMP}/changed.txt"; then
            echo "::group::Home screen, launch and welcome photos"
            app="${DERIVED_DATA}/Build/Products/Debug-iphonesimulator/HermesMobile.app"
            id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Info.plist")
            xcrun simctl install "${ONE}" "${app}"
            xcrun simctl io "${ONE}" screenshot "${TEST_RUNNER_FOTO_DIR}/1-home-screen.png"
            # Held before main, the app stays on its launch screen for the photo.
            xcrun simctl launch --terminate-running-process --wait-for-debugger "${ONE}" "${id}"
            sleep 2
            xcrun simctl io "${ONE}" screenshot "${TEST_RUNNER_FOTO_DIR}/2-launch.png"
            xcrun simctl launch --terminate-running-process "${ONE}" "${id}"
            sleep 4
            xcrun simctl io "${ONE}" screenshot "${TEST_RUNNER_FOTO_DIR}/3-welcome.png"
            xcrun simctl terminate "${ONE}" "${id}"
            echo "::endgroup::"
          fi
          exit "${failed}"

      # PNGs are compressed already: zipping them again only costs time.
      - name: Photos
        if: ${{ !cancelled() && hashFiles('ci-foto/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: foto
          path: ci-foto
          compression-level: 0
