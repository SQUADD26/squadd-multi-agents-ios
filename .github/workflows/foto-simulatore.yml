# Simulator photos for a review: the home screen icon, the launch screen, the first screen, and
# the branded screens behind sign-in (BrandPhotoTests), in dark appearance. Push a branch named foto/<anything> to run it; the photos are the artifact.
name: Foto simulatore

on:
  push:
    branches: ['foto/**']

permissions:
  contents: read

jobs:
  photos:
    name: Simulator photos
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      SIMULATOR_NAME: iPhone 17
    steps:
      - uses: actions/checkout@v7

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["SIMULATOR_RUNTIME"], [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))')
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build Debug for the simulator
        run: |
          set -euo pipefail
          xcodebuild build -project HermesMobile.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO -quiet

      - name: Take photos
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p photos
          app=DerivedData/Build/Products/Debug-iphonesimulator/HermesMobile.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Info.plist")
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          xcrun simctl ui "${UDID}" appearance dark
          xcrun simctl install "${UDID}" "${app}"
          sleep 8
          xcrun simctl io "${UDID}" screenshot photos/1-home-screen.png
          # Held before main, the app stays on its launch screen for the photo.
          xcrun simctl launch --wait-for-debugger "${UDID}" "${bundle_id}"
          sleep 4
          xcrun simctl io "${UDID}" screenshot photos/2-launch.png
          xcrun simctl terminate "${UDID}" "${bundle_id}"
          xcrun simctl launch "${UDID}" "${bundle_id}"
          sleep 8
          xcrun simctl io "${UDID}" screenshot photos/3-welcome.png

      # Home header, Settings → About and Acknowledgements need a signed-in server to reach by
      # hand; BrandPhotoTests renders those real views in the app host and saves them here.
      - name: Photograph the screens behind sign-in
        env:
          TEST_RUNNER_BRAND_PHOTOS_DIR: ${{ github.workspace }}/photos
        run: |
          set -euo pipefail
          xcodebuild test -project HermesMobile.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData -only-testing:HermesMobileTests/BrandPhotoTests \
            CODE_SIGNING_ALLOWED=NO -quiet
          ls photos

      # The Squadd chat (#11): its tests against the recorded turn, then a conversation with the live
      # companion the secrets name, photographed. Without the secrets the live part skips itself.
      - name: Squadd chat tests and live photos
        env:
          TEST_RUNNER_BRAND_PHOTOS_DIR: ${{ github.workspace }}/photos
          # Where the disposable companion's tunnel publishes its current address.
          SQUADD_LIVE_LOOKUP: ${{ secrets.SQUADD_LIVE_LOOKUP }}
          TEST_RUNNER_SQUADD_LIVE_TOKEN: ${{ secrets.SQUADD_LIVE_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p photos
          dest="platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          only=(-only-testing:HermesMobileTests/SquaddChatTests -only-testing:HermesMobileTests/SquaddChatLivePhotoTests)
          xcodebuild build-for-testing -project HermesMobile.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination "${dest}" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO > photos/squadd-build.log 2>&1 \
            || { tail -50 photos/squadd-build.log; exit 1; }
          # Read just before the tests start: the tunnel's address changes every few minutes.
          if [ -n "${SQUADD_LIVE_LOOKUP}" ]; then
            TEST_RUNNER_SQUADD_LIVE_URL="$(curl -fsS -m 15 "${SQUADD_LIVE_LOOKUP}" || true)"
            export TEST_RUNNER_SQUADD_LIVE_URL
          fi
          xcodebuild test-without-building -project HermesMobile.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination "${dest}" -derivedDataPath DerivedData -resultBundlePath squadd.xcresult "${only[@]}" \
            CODE_SIGNING_ALLOWED=NO > photos/squadd-tests.log 2>&1
          status=$?
          # The failure messages live only in the result bundle.
          xcrun xcresulttool get test-results tests --path squadd.xcresult > photos/squadd-results.json || true
          grep -E "Test Case|error:|XCTAssert|Executed" photos/squadd-tests.log || tail -50 photos/squadd-tests.log
          grep -E '"(name|result|failureMessage)"' photos/squadd-results.json || true
          ls photos
          exit "${status}"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-photos
          path: photos
