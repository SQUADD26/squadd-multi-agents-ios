# A branch's own workflow on a hosted macOS runner builds from scratch for 40 minutes (#67): cancel it (ci/runner_guard.py).
name: Runner guard

on:
  push:
    branches-ignore: [dev, main, master]

permissions:
  contents: read
  actions: write

jobs:
  guard:
    if: ${{ !github.event.deleted }}
    runs-on: squadd-multi-ios-pr  # either Mac runner: nothing runs on GitHub's runners
    timeout-minutes: 1
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/runner_guard.py?ref=${GITHUB_SHA}" -o guard.py
          python3 guard.py "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
